<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Tesouraria Veteranos FC</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Tesouraria Veteranos FC</h1>

<div class="cards">
    <div class="card">
        <h3>Saldo</h3>
        <span id="saldo"></span>
    </div>

    <div class="card verde">
        <h3>Receitas</h3>
        <span id="receitas"></span>
    </div>

    <div class="card vermelho">
        <h3>Despesas</h3>
        <span id="despesas"></span>
    </div>
</div>

<div class="graficos">

    <div class="grafico">
        <canvas id="grafico1"></canvas>
    </div>

    <div class="grafico">
        <canvas id="grafico2"></canvas>
    </div>

</div>

<h2>Movimentos</h2>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Valor (€)</th>
</tr>
</thead>

<tbody id="tabela"></tbody>

</table>

<script src="script.js"></script>

</body>
</html>
