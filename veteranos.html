<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veteranos A.D.C. Lobão — Transparência Financeira</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--azul-escuro:#082347;--azul-medio:#0D3B66;--azul-claro:#1A6FB5;--azul-light:#5BA4D9;--azul-bg:#dbeafe;--bg:#F0F4F8;--card:#fff;--cinza:#64748b;--vermelho:#c1121f;--laranja:#dc6843;--nav-h:56px}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1a1a1a;min-height:100vh}

/* ─── NAVBAR (mgsad style) ─── */
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);background:rgba(8,35,71,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.nav-brand{color:#fff;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase}

/* Burger / X toggle */
.burger-btn{background:none;border:none;cursor:pointer;padding:10px;width:40px;height:40px;position:relative;z-index:110}
.burger-btn span{display:block;width:22px;height:1.5px;background:#fff;position:absolute;left:9px;transition:all .35s cubic-bezier(.4,0,.2,1)}
.burger-btn span:nth-child(1){top:13px;width:22px}
.burger-btn span:nth-child(2){top:19px;width:16px}
.burger-btn span:nth-child(3){top:25px;width:22px}
.burger-btn.open span:nth-child(1){top:19px;transform:rotate(45deg);width:22px}
.burger-btn.open span:nth-child(2){opacity:0;width:0}
.burger-btn.open span:nth-child(3){top:19px;transform:rotate(-45deg);width:22px}

/* ─── DROPDOWN PANEL (slides down from navbar) ─── */
.menu-panel{position:fixed;top:var(--nav-h);left:0;right:0;z-index:90;background:rgba(20,30,48,.97);max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);border-bottom:1px solid rgba(255,255,255,.06)}
.menu-panel.open{max-height:400px}
.menu-panel-inner{padding:16px 0 20px}
.menu-link{display:block;color:rgba(255,255,255,.55);font-size:14px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;padding:14px 28px;border:none;background:none;cursor:pointer;font-family:inherit;width:100%;text-align:left;transition:all .2s;border-left:3px solid transparent}
.menu-link:hover{color:#fff;background:rgba(255,255,255,.04)}
.menu-link.active{color:#fff;border-left-color:var(--azul-claro)}

/* Stripe */
.stripe{position:fixed;top:var(--nav-h);left:0;right:0;height:3px;background:linear-gradient(90deg,#fff 0%,#fff 33%,#1A6FB5 33%,#1A6FB5 66%,#fff 66%);z-index:95}

main{max-width:940px;margin:0 auto;padding:80px 16px 60px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
.card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(13,59,102,.06);border-top:3px solid var(--azul-medio)}
.card-label{font-size:11px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.card-value{font-size:26px;font-weight:700;color:var(--azul-medio);letter-spacing:-.5px;line-height:1.2}
.card-sub{font-size:11px;color:#aaa;margin-top:3px}
.section-card{background:#fff;border-radius:10px;padding:20px 16px;box-shadow:0 1px 4px rgba(13,59,102,.06);margin-bottom:16px}
.section-title{font-size:14px;font-weight:600;margin:0 0 16px 2px;color:var(--azul-medio);letter-spacing:-.2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #e8eef5}
td{padding:10px 12px;color:#333;border-bottom:1px solid #f0f3f7}
th.center,td.center{text-align:center}
tfoot td{border-top:2px solid var(--azul-medio);border-bottom:none;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-ok{background:var(--azul-bg);color:var(--azul-medio);border:1px solid #bfdbfe}
.badge-falta{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700}
.dot-ok{background:var(--azul-bg);color:var(--azul-medio)}
.dot-falta{background:#fee2e2;color:#991b1b}
.player-name{font-weight:500;white-space:nowrap}
.player-name.em-falta{color:var(--vermelho);font-weight:600}
.tab-panel{display:none}.tab-panel.active{display:block}
.chart-container{position:relative;width:100%;max-height:260px}
.note{font-size:11px;color:#aaa;text-align:center;margin-top:20px}
.table-wrap{overflow-x:auto}
.sub-tabs{display:flex;gap:0;margin-bottom:20px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(13,59,102,.06)}
.sub-tab{flex:1;padding:12px 10px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#888;font-family:inherit;transition:all .2s;border-bottom:2px solid transparent}
.sub-tab.active{color:var(--azul-medio);background:#f0f6ff;font-weight:600;border-bottom-color:var(--azul-claro)}
.sub-panel{display:none}.sub-panel.active{display:block}
.match-card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(13,59,102,.06);margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.match-date{font-size:11px;color:#888;font-weight:600;min-width:70px;text-align:center}
.match-date span{display:block;font-size:9px;color:#aaa;text-transform:uppercase;margin-top:2px}
.match-teams{flex:1;min-width:180px}
.match-home,.match-away{font-size:13px;color:#333}.match-home.us,.match-away.us{color:var(--azul-medio);font-weight:700}
.match-vs{font-size:10px;color:#bbb;margin:2px 0;text-transform:uppercase;letter-spacing:1px}
.match-score{font-size:20px;font-weight:700;color:var(--azul-medio);min-width:60px;text-align:center;letter-spacing:1px}
.match-score.win{color:#16a34a}.match-score.loss{color:var(--vermelho)}.match-score.draw{color:#d97706}
.match-score.pending{font-size:12px;color:#aaa;font-weight:500}
.match-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.match-badge.v{background:#dcfce7;color:#166534}.match-badge.d{background:#fef3c7;color:#92400e}.match-badge.e{background:#fee2e2;color:#991b1b}.match-badge.prox{background:#e0f2fe;color:#0369a1}
.class-table td,.class-table th{padding:8px 10px;text-align:center;font-size:13px}
.class-table th{font-size:10px}
.class-table td:first-child,.class-table th:first-child{text-align:center;width:30px}
.class-table td:nth-child(2),.class-table th:nth-child(2){text-align:left}
.class-row-us{background:#f0f6ff !important}.class-row-us td{color:var(--azul-medio);font-weight:700}
.class-pos{font-weight:700;color:var(--azul-medio)}
.scorer-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f3f7}
.scorer-row:last-child{border-bottom:none}
.scorer-pos{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.scorer-pos.gold{background:#fef3c7;color:#92400e}.scorer-pos.silver{background:#f1f5f9;color:#475569}.scorer-pos.bronze{background:#fff7ed;color:#9a3412}.scorer-pos.normal{background:#f0f4f8;color:#64748b}
.scorer-name{flex:1;font-size:14px;font-weight:500;color:#333}
.scorer-goals{font-size:20px;font-weight:700;color:var(--azul-medio)}.scorer-goals span{font-size:11px;color:#aaa;font-weight:400;margin-left:4px}
.ata-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(13,59,102,.06);margin-bottom:14px;border-left:4px solid var(--azul-claro)}
.ata-card.destaque{border-left-color:#d4a017}
.ata-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ata-date{font-size:12px;color:#fff;background:var(--azul-medio);padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
.ata-title{font-size:15px;font-weight:600;color:var(--azul-medio)}
.ata-body{font-size:13px;color:#444;line-height:1.7}.ata-body ul{margin:8px 0 0 18px;padding:0}.ata-body li{margin-bottom:4px}.ata-body li::marker{color:var(--azul-claro)}
.ata-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-right:6px}
.ata-tag.decisao{background:#dbeafe;color:#0D3B66}.ata-tag.info{background:#e0f2fe;color:#0369a1}.ata-tag.urgente{background:#fef3c7;color:#92400e}
.ata-presentes{font-size:11px;color:#999;margin-top:10px;padding-top:8px;border-top:1px solid #f0f3f7}
footer{background:#082347;color:rgba(255,255,255,.6);text-align:center;padding:20px 16px;font-size:12px}
footer strong{color:rgba(255,255,255,.85);font-weight:600}

@media(max-width:600px){
  .cards-grid{grid-template-columns:1fr 1fr}
  .card-value{font-size:22px}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <span class="nav-brand">Veteranos ADC Lobão</span>
  <button class="burger-btn" id="burgerBtn" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="stripe"></div>

<!-- DROPDOWN PANEL -->
<div class="menu-panel" id="menuPanel">
  <div class="menu-panel-inner">
    <button class="menu-link active" onclick="menuNav('resumo')">📊  Resumo</button>
    <button class="menu-link" onclick="menuNav('despesas')">💰  Despesas</button>
    <button class="menu-link" onclick="menuNav('quotas')">👥  Quotas</button>
    <button class="menu-link" onclick="menuNav('competicao')">🏆  Competição</button>
    <button class="menu-link" onclick="menuNav('atas')">📋  Atas</button>
  </div>
</div>

<main>
  <div id="tab-resumo" class="tab-panel active">
    <div class="cards-grid" id="resumo-cards"></div>
    <div class="section-card"><h2 class="section-title">Receitas vs Despesas por Mês</h2><div class="chart-container"><canvas id="chartBarMensal"></canvas></div></div>
    <div class="section-card"><h2 class="section-title">Evolução do Saldo Acumulado</h2><div class="chart-container"><canvas id="chartSaldo"></canvas></div></div>
    <p class="note">Última atualização: 1 de Agosto de 2026 · Dados fictícios para validação de layout</p>
  </div>
  <div id="tab-despesas" class="tab-panel">
    <div class="section-card"><h2 class="section-title">Distribuição de Despesas</h2><div class="chart-container" style="max-height:300px"><canvas id="chartPie"></canvas></div></div>
    <div class="section-card"><h2 class="section-title">Detalhe Mensal de Despesas</h2><div class="table-wrap" id="tabela-despesas"></div></div>
  </div>
  <div id="tab-quotas" class="tab-panel">
    <div class="cards-grid" id="quotas-cards"></div>
    <div class="section-card"><h2 class="section-title">Estado das Quotas por Jogador</h2><div class="table-wrap" id="tabela-quotas"></div></div>
  </div>
  <div id="tab-competicao" class="tab-panel">
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="showSubTab('calendario')">📅 Calendário</button>
      <button class="sub-tab" onclick="showSubTab('classificacao')">🏆 Classificação</button>
      <button class="sub-tab" onclick="showSubTab('marcadores')">⚽ Marcadores</button>
    </div>
    <div id="sub-calendario" class="sub-panel active"></div>
    <div id="sub-classificacao" class="sub-panel"></div>
    <div id="sub-marcadores" class="sub-panel"></div>
  </div>
  <div id="tab-atas" class="tab-panel">
    <div class="cards-grid" id="atas-cards"></div>
    <div id="atas-lista"></div>
  </div>
</main>

<footer><strong>Veteranos A.D.C. Lobão</strong><br>Lobão, Santa Maria da Feira</footer>

<script>
// ─── MENU LOGIC ───
let menuOpen = false;
function toggleMenu(){
  menuOpen = !menuOpen;
  document.getElementById('menuPanel').classList.toggle('open', menuOpen);
  document.getElementById('burgerBtn').classList.toggle('open', menuOpen);
}
function menuNav(id){
  toggleMenu();
  showTab(id);
  document.querySelectorAll('.menu-link').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.menu-link').forEach(b=>{
    if(b.textContent.toLowerCase().includes(id.slice(0,4))) b.classList.add('active');
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen)toggleMenu()});
// ─── DADOS REAIS (Época 26/27) ───
const MESES = ["Set","Out","Nov","Dez","Jan","Fev","Mar","Abr","Mai","Jun"];
const QUOTA = 20;
const QUOTA_NI = 10;
const SALDO_INICIAL = 2220;

const inscritos = [
  {nome:"André Pinho",apelido:"PINHO",num:30,nasc:"13/12/1984",gr:false},
  {nome:"Sérgio Tavares",apelido:"TAVARES",num:27,nasc:"10/10/1984",gr:false},
  {nome:"Américo Oliveira",apelido:"AMÉRICO",num:13,nasc:"10/08/1982",gr:false},
  {nome:"Armando",apelido:"ARMANDO",num:7,nasc:"19/03/1973",gr:false},
  {nome:"Hugo André",apelido:"H. ANDRÉ",num:6,nasc:"10/05/1986",gr:false},
  {nome:"Mário Oliveira",apelido:"MÁRIO",num:18,nasc:"11/11/1970",gr:false},
  {nome:"Mendes",apelido:"MENDES",num:21,nasc:"28/05/1986",gr:false},
  {nome:"Rui Rocha",apelido:"RUI ROCHA",num:77,nasc:"12/11/1988",gr:false},
  {nome:"António Rocha",apelido:"ROCHINHA",num:11,nasc:"08/04/1965",gr:false},
  {nome:"Pedro Cadete",apelido:"CADETE",num:17,nasc:"10/07/1973",gr:false},
  {nome:"António Oliveira",apelido:"OLIVEIRA",num:8,nasc:"10/11/1988",gr:false},
  {nome:"Amílcar André",apelido:"AMILCAR",num:10,nasc:"26/01/1987",gr:false},
  {nome:"Pedro Costa",apelido:"MOCHO",num:9,nasc:"13/07/1986",gr:false},
  {nome:"Sérgio (Ervilha)",apelido:"SÉRGIO",num:79,nasc:"31/10/1986",gr:false},
  {nome:"Pedro Ferreira",apelido:"PEDRO F.",num:71,nasc:"11/02/1979",gr:false},
  {nome:"Jorge Santos",apelido:"JORGE",num:23,nasc:"28/09/1989",gr:false},
  {nome:"Américo Silva",apelido:"AMÉRICO SILVA",num:88,nasc:"12/10/1979",gr:false},
  {nome:"Tiago Mota",apelido:"MOTINHA",num:98,nasc:"28/02/1990",gr:false},
  {nome:"José Eduardo",apelido:"ZÉ EDUARDO",num:5,nasc:"01/09/1985",gr:false},
  {nome:"Sergio Rodrigues",apelido:"RODRIGUES",num:25,nasc:"01/11/1983",gr:false},
  {nome:"Joel Tavares",apelido:"JOEL",num:3,nasc:"27/09/1981",gr:false},
  {nome:"Fábio Gonçalves",apelido:"FÁBIO",num:null,nasc:"13/07/1990",gr:true},
  {nome:"André Lopes",apelido:"ANDRÉ",num:20,nasc:"15/08/1990",gr:false},
  {nome:"António José Silva",apelido:"TOZE",num:70,nasc:"16/03/1981",gr:false},
  {nome:"Miguel Almeida",apelido:"MIGUEL",num:19,nasc:"10/05/1974",gr:false},
  {nome:"Sergio Silva",apelido:"SERGINHO",num:4,nasc:"01/01/1988",gr:false},
  {nome:"Luís Paiva",apelido:"LUÍS",num:26,nasc:"21/11/1982",gr:false},
];

const naoInscritos = [
  {nome:"Inácio",apelido:"INÁCIO",num:3,nasc:"26/10/1976"},
  {nome:"Telmo",apelido:"TELMO",num:null,nasc:"23/03/1991"},
  {nome:"Fábio Oliveira",apelido:"FÁBIO",num:null,nasc:"21/10/2000"},
  {nome:"Romeu",apelido:"ROMEU",num:2,nasc:"11/05/1976"},
  {nome:"Marcelo",apelido:"MARCELO",num:null,nasc:"18/12/1992"},
  {nome:"Celso Ferreira",apelido:"CELSO",num:null,nasc:null},
  {nome:"Daniel Dias",apelido:"DANIEL",num:null,nasc:"10/03/1982"},
  {nome:"Salvador",apelido:"SALVADOR",num:null,nasc:"13/07/1978"},
  {nome:"Vitor Leite",apelido:"VITINHA GR",num:null,nasc:"01/06/1992"},
  {nome:"Zé Buraca",apelido:"ZÉ BURACA",num:null,nasc:"04/08/1980"},
];

const nInscPagam = inscritos.filter(j=>!j.gr).length;
const receitaMensalEsperada = nInscPagam * QUOTA;
const saldo = SALDO_INICIAL;

// ─── TABS ───
const chartInstances = {};
function freshCanvas(id){ const o=document.getElementById(id);const p=o.parentNode;o.remove();const c=document.createElement('canvas');c.id=id;p.appendChild(c);return c; }
function destroyCharts(...n){ n.forEach(k=>{ if(chartInstances[k]){ chartInstances[k].destroy(); delete chartInstances[k]; } }); }
function showTab(id){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(id==='resumo'){ destroyCharts('bar','line'); setTimeout(initResumoCharts,50); }
  if(id==='despesas'){ destroyCharts('pie'); setTimeout(initDespesasChart,50); }
}
function makeCard(l,v,s,a){ return `<div class="card" style="border-top-color:${a}"><div class="card-label">${l}</div><div class="card-value" style="color:${a}">${v}</div>${s?`<div class="card-sub">${s}</div>`:''}</div>`; }

// ─── RESUMO CARDS ───
document.getElementById('resumo-cards').innerHTML =
  makeCard('Saldo Atual','€'+saldo,'Caixa transitada','#0D3B66')+
  makeCard('Caixa Transitada','€'+SALDO_INICIAL,'Época anterior','#1A6FB5')+
  makeCard('Receita Esperada','€'+receitaMensalEsperada+'/mês',nInscPagam+' inscritos × €'+QUOTA,'#64748b')+
  makeCard('Plantel',inscritos.length+' + '+naoInscritos.length,inscritos.length+' inscritos · '+naoInscritos.length+' não inscritos','#0D3B66');

// ─── QUOTAS CARDS ───
document.getElementById('quotas-cards').innerHTML =
  makeCard('Inscritos',inscritos.length,'(1 GR isento)','#0D3B66')+
  makeCard('Não Inscritos',naoInscritos.length,'€10/mês','#1A6FB5')+
  makeCard('Quota Inscrito','€20/mês','Set–Jun','#64748b')+
  makeCard('Quota Não Inscrito','€10/mês','quando comparecem','#0D3B66');

// ─── CHARTS ───
const animOpts = {animation:{duration:900,easing:'easeOutQuart'}};
const chartOpts = {responsive:true,maintainAspectRatio:true,...animOpts,plugins:{legend:{display:true,labels:{usePointStyle:true,pointStyle:'circle',padding:16,font:{size:12}}}},scales:{x:{grid:{display:false},ticks:{font:{size:12}}},y:{grid:{color:'#f0f3f7'},ticks:{font:{size:11},callback:v=>'€'+v}}}};

function initResumoCharts(){
  const prevRec = MESES.map(()=>receitaMensalEsperada);
  const prevDesp = MESES.map((_,i)=> i===0 ? 1500 : 0);
  chartInstances.bar = new Chart(freshCanvas('chartBarMensal'),{
    type:'bar',data:{labels:MESES,datasets:[
      {label:'Receita Esperada',data:prevRec,backgroundColor:'#1A6FB5',borderRadius:4,barPercentage:.45},
      {label:'Despesas Previstas',data:prevDesp,backgroundColor:'#C5D5E4',borderRadius:4,barPercentage:.45},
    ]},options:chartOpts
  });
  let acc=SALDO_INICIAL;
  const sp=MESES.map((_,i)=>{acc+=prevRec[i]-prevDesp[i];return acc;});
  chartInstances.line = new Chart(freshCanvas('chartSaldo'),{
    type:'line',data:{labels:['Início',...MESES],datasets:[{label:'Saldo Previsto',data:[SALDO_INICIAL,...sp],borderColor:'#0D3B66',backgroundColor:'rgba(13,59,102,.08)',fill:true,tension:.3,pointRadius:5,pointBackgroundColor:'#0D3B66',borderWidth:2.5}]},
    options:{...chartOpts,plugins:{...chartOpts.plugins,legend:{display:false}}}
  });
}
function initDespesasChart(){
  const pd=[{name:'Campo',value:1000,color:'#0D3B66'},{name:'Inscrição AFA (€20×25)',value:500,color:'#1A6FB5'}];
  chartInstances.pie = new Chart(freshCanvas('chartPie'),{
    type:'doughnut',data:{labels:pd.map(c=>c.name),datasets:[{data:pd.map(c=>c.value),backgroundColor:pd.map(c=>c.color),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:true,...animOpts,cutout:'55%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:14,font:{size:12}}},tooltip:{callbacks:{label:ctx=>ctx.label+': €'+ctx.raw}}}}
  });
}
initResumoCharts();

// ─── TABELA DESPESAS ───
let dh='<table><thead><tr><th>Despesa Prevista</th><th>Valor</th><th>Quando</th></tr></thead><tbody>';

// ─── TABELA QUOTAS ───
function calcIdade(nasc){ if(!nasc) return '—'; const p=nasc.split('/'); const d=new Date(p[2],p[1]-1,p[0]); const diff=Date.now()-d.getTime(); return Math.floor(diff/31557600000); }
// Map birth month to season month index: Set=0(9),Out=1(10),Nov=2(11),Dez=3(12),Jan=4(1),Fev=5(2),Mar=6(3),Abr=7(4),Mai=8(5),Jun=9(6)
const mesMap={9:0,10:1,11:2,12:3,1:4,2:5,3:6,4:7,5:8,6:9};
function getBirthMonthIdx(nasc){ if(!nasc) return -1; const m=parseInt(nasc.split('/')[1]); return mesMap[m]!==undefined?mesMap[m]:-1; }
function monthCell(m,birthIdx){
  if(m===birthIdx) return '<td class="center" style="padding:7px 3px;background:#fff7ed"><span style="font-size:13px" title="Mês de aniversário">🎂</span></td>';
  return '<td class="center" style="padding:7px 3px"><span style="color:#ccc;font-size:10px">—</span></td>';
}

let qh='<h3 style="font-size:13px;color:#0D3B66;font-weight:600;margin:0 0 12px 4px;text-transform:uppercase;letter-spacing:.4px">Inscritos (€20/mês)</h3>';
qh+='<div class="table-wrap"><table><thead><tr><th style="width:30px">Nº</th><th>Nome</th><th class="center">Nasc.</th><th class="center">Idade</th>';
MESES.forEach(m=>qh+=`<th class="center" style="min-width:34px;padding:8px 4px">${m}</th>`);
qh+='<th class="center">Estado</th></tr></thead><tbody>';

inscritos.forEach(j=>{
  const grTag = j.gr ? ' <span style="font-size:9px;color:#1A6FB5;font-weight:700;background:#dbeafe;padding:1px 5px;border-radius:4px">GR</span>' : '';
  const bi = getBirthMonthIdx(j.nasc);
  qh+=`<tr><td class="center" style="color:#999;font-size:12px">${j.num||'—'}</td>`;
  qh+=`<td class="player-name">${j.nome}${grTag}</td>`;
  qh+=`<td class="center" style="font-size:11px;color:#888">${j.nasc||'—'}</td>`;
  qh+=`<td class="center" style="font-size:12px">${calcIdade(j.nasc)}</td>`;
  for(let m=0;m<10;m++) qh+=monthCell(m,bi);
  if(j.gr) qh+='<td class="center"><span class="badge badge-ok">Isento</span></td></tr>';
  else qh+='<td class="center"><span style="color:#999;font-size:11px">Inicia Set</span></td></tr>';
});
qh+='</tbody></table></div>';

qh+='<h3 style="font-size:13px;color:#dc6843;font-weight:600;margin:24px 0 12px 4px;text-transform:uppercase;letter-spacing:.4px">Não Inscritos (€10/mês)</h3>';
qh+='<div class="table-wrap"><table><thead><tr><th style="width:30px">Nº</th><th>Nome</th><th class="center">Nasc.</th><th class="center">Idade</th>';
MESES.forEach(m=>qh+=`<th class="center" style="min-width:34px;padding:8px 4px">${m}</th>`);
qh+='<th class="center">Estado</th></tr></thead><tbody>';

naoInscritos.forEach(j=>{
  const bi = getBirthMonthIdx(j.nasc);
  qh+=`<tr><td class="center" style="color:#999;font-size:12px">${j.num||'—'}</td>`;
  qh+=`<td class="player-name">${j.nome}</td>`;
  qh+=`<td class="center" style="font-size:11px;color:#888">${j.nasc||'—'}</td>`;
  qh+=`<td class="center" style="font-size:12px">${calcIdade(j.nasc)}</td>`;
  for(let m=0;m<10;m++) qh+=monthCell(m,bi);
  qh+='<td class="center"><span style="color:#999;font-size:11px">Inicia Set</span></td></tr>';
});
qh+='</tbody></table></div>';
qh+='<p class="note" style="margin-top:12px">Inscritos: €20/mês · Não inscritos: €10/mês · GR isento · Atleta que não compareça a treino nem jogo não paga · 🎂 Mês de aniversário</p>';
document.getElementById('tabela-quotas').innerHTML=qh;

function showSubTab(id){
  document.querySelectorAll('.sub-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sub-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('sub-'+id).classList.add('active');
  document.querySelectorAll('.sub-tab').forEach(b=>{ if(b.textContent.toLowerCase().includes(id.slice(0,5))) b.classList.add('active'); });
}
